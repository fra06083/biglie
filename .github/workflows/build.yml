name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"
      - "*.png"
      - "*.yml"

concurrency:
  group: build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: src

      - name: Checkout builds branch
        uses: actions/checkout@v4
        with:
          ref: builds
          path: builds

      - name: Clean old builds
        run: rm -f "$GITHUB_WORKSPACE"/builds/*.cs3

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.1
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Build plugins
        run: |
          cd "$GITHUB_WORKSPACE/src"
          chmod +x gradlew
          ./gradlew --no-daemon make makePluginsJson
          find . -path "*/build/*.cs3" -type f -exec cp -v {} "$GITHUB_WORKSPACE/builds/" \;
          cp build/plugins.json "$GITHUB_WORKSPACE/builds/plugins.json"
          cat > "$GITHUB_WORKSPACE/builds/repo.json" <<'EOF'
          {
            "name": "biglie",
            "iconUrl": "https://raw.githubusercontent.com/fra06083/biglie/main/repo_icon.png",
            "description": "StreamingCommunity per CloudStream con dominio aggiornato da Telegram",
            "manifestVersion": 1,
            "pluginLists": [
              "https://raw.githubusercontent.com/fra06083/biglie/builds/plugins.json"
            ]
          }
          EOF

      - name: Publish builds
        run: |
          cd "$GITHUB_WORKSPACE/builds"
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add -A
          git commit -m "Build $GITHUB_SHA" || exit 0
          git push origin HEAD:builds
