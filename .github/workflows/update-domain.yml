name: Update domain from Telegram

on:
  schedule:
    # Ogni 6 ore (UTC)
    - cron: "17 3,9,15,21 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read the latest domain from Telegram
        id: update
        run: |
          python3 scripts/update_domain.py
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.update.outputs.changed == 'true'
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add -A
          git commit -m "chore: auto-update StreamingCommunity domain from Telegram"
          git push

      # I push fatti con GITHUB_TOKEN non avviano altri workflow:
      # dispatch esplicito della build per pubblicare la nuova versione.
      - name: Trigger build
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --repo "$GITHUB_REPOSITORY"
